name: Test Suite

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install
        working-directory: apps/web

      - name: Run frontend tests
        run: bun run test
        working-directory: apps/web

      - name: Run frontend typecheck
        run: bun run typecheck
        working-directory: apps/web

      - name: Run frontend lint
        run: bun run lint
        working-directory: apps/web

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    environment: a

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install backend dependencies
        run: bun install
        working-directory: apps/api

      - name: Run backend typecheck
        run: bun run typecheck
        working-directory: apps/api

      - name: Run backend lint
        run: bun run lint
        working-directory: apps/api

      - name: Run backend architecture check
        run: bun run lint:arch
        working-directory: apps/api

      - name: TEMP one-time backfill migration tracking
        run: bun run scripts/backfill-migration-tracking.ts
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DEVDATABASE_URL }}

      - name: Run backend migrations
        run: bunx drizzle-kit migrate
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DEVDATABASE_URL }}

      - name: Run backend integration tests
        run: bun run test:ci
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DEVDATABASE_URL }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          CORS_ORIGIN: http://localhost:5173
          PORT: "5000"
          NODE_ENV: test

