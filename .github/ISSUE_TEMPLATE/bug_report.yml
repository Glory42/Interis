name: Bug report
description: Something in Interis is broken or behaves unexpectedly
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For security problems, **do not** open an issue — see [SECURITY.md](https://github.com/Glory42/Interis/blob/master/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '/movies/...'
        2. Click 'Log'
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Diary / logging
        - Reviews
        - Feed / social
        - Profiles / lists / likes / watchlist
        - Films / TV / archive
        - Auth / account settings
        - Themes / UI
        - Public API (/api/public/*)
        - Local dev / Docker / tooling
        - Other
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Where did you see it?
      options:
        - Live site (interis.gorkemkaryol.dev)
        - Local development
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 140 on Arch Linux

  - type: input
    id: theme
    attributes:
      label: Theme
      description: Only if the bug is visual.
      placeholder: nitrate

  - type: textarea
    id: logs
    attributes:
      label: Screenshots, console output or logs
      description: Drag screenshots in here. Paste logs as text — they are rendered as code.
      render: shell
